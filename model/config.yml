#configuration for image classification training
# Usage: python train.py --config config.yaml
data_dir: "./data"
output_dir: "./outputs"
num_classes: 10
image_size: 224
model_name: "resnet50"  # Options: resnet18, resnet34, resnet50, resnet101, efficientnet_b0, efficientnet_b3, efficientnet_b4
pretrained: true
dropout: 0.5
epochs: 100
batch_size: 32
num_workers: 4
pin_memory: true
lr: 0.001
weight_decay: 0.0001
optimizer: "adamw"  # adamw or sgd
label_smoothing: 0.1
scheduler: "cosine" 
warmup_epochs: 5
min_lr: 0.000001
use_autoaugment: true
mixup_alpha: 0.2
cutmix_alpha: 0.0
use_amp: true
gradient_clip: 1.0
accumulate_grad_batches: 1
early_stopping_patience: 10
save_top_k: 3
seed: 42
local_rank: -1
world_size: 1